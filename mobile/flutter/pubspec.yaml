name: purplecallio_flutter
description: >-
  PurpleCallio SDK for Flutter: 1:1 voice and video calls on Android and iOS
  using WebRTC, authenticated with participant tokens from your backend.
version: 0.1.0
homepage: https://purplecallio.com
repository: https://github.com/samaydhawale000/BlueJoinet/tree/main/mobile/flutter
issue_tracker: https://github.com/samaydhawale000/BlueJoinet/issues
topics:
  - webrtc
  - video-call
  - voice-call
  - realtime
  - communication

platforms:
  android:
  ios:

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.2.0
  http: ^1.2.0
  meta: ^1.15.0
  socket_io_client: ^3.1.2

dev_dependencies:
  fake_async: ^1.3.1
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
