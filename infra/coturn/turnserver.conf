# ── Ports ──────────────────────────────────────────────────
listening-port=3478
tls-listening-port=5349

# ── Auth ───────────────────────────────────────────────────
# Time-limited HMAC credentials (RFC 5766)
# static-auth-secret is passed via --static-auth-secret CLI flag
# so the secret stays out of this file and in your .env
use-auth-secret
realm=purplecallio.com
stale-nonce=600

# ── Relay port range ───────────────────────────────────────
min-port=49152
max-port=65535

# Allocation and bandwidth ceilings are passed as explicit CLI options from
# Docker Compose so operators can tune them after measuring the host/network.
# Do not set user-quota here: TURN REST usernames can be shared by clients
# whose credentials were issued in the same second.

# ── Security ───────────────────────────────────────────────
fingerprint
no-loopback-peers
no-multicast-peers
# Relays may only reach public peers. Without these, any credential holder
# could use the relay to reach the host's private network or the OCI
# instance metadata service (169.254.169.254). Real peers are reached on
# their public (srflx/relay) addresses, so calls are unaffected.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# external-ip is injected via --external-ip=$TURN_SERVER in docker-compose command
