# ── Ports ──────────────────────────────────────────────────
listening-port=3478
tls-listening-port=5349

# ── Auth ───────────────────────────────────────────────────
# Time-limited HMAC credentials (RFC 5766)
# static-auth-secret is passed via --static-auth-secret CLI flag
# so the secret stays out of this file and in your .env
use-auth-secret
realm=purplecallio.com
stale-nonce=600

# ── Relay port range ───────────────────────────────────────
min-port=49152
max-port=65535

# Allocation and bandwidth ceilings are passed as explicit CLI options from
# Docker Compose so operators can tune them after measuring the host/network.
# Do not set user-quota here: TURN REST usernames can be shared by clients
# whose credentials were issued in the same second.

# ── Security ───────────────────────────────────────────────
fingerprint
no-loopback-peers
no-multicast-peers

# external-ip is injected via --external-ip=$TURN_SERVER in docker-compose command
