# HTTP → HTTPS
server {
    listen 80;
    server_name purplecallio.serveminecraft.net;

    return 301 https://$host$request_uri;
}


# HTTPS
server {
    listen 443 ssl;
    server_name purplecallio.serveminecraft.net;

    ssl_certificate /etc/letsencrypt/live/purplecallio.serveminecraft.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/purplecallio.serveminecraft.net/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        proxy_pass http://server:3005/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://server:3005;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://web:5173;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}