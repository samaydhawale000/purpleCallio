services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - purplecallio

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NestJS API Server ───────────────────────────────────────────────────────
  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PORT: 3005
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      # Public TURN hostname clients dial. Must be a DNS name covered by the
      # Coturn TLS certificate below; turns:5349 is not advertised for an IP.
      TURN_HOST: ${TURN_HOST:-${PUBLIC_HOST}}
      TURN_SERVER: ${TURN_SERVER:-}
      TURN_SECRET: ${TURN_SECRET}
      TURN_CREDENTIAL_TTL_SECONDS: ${TURN_CREDENTIAL_TTL_SECONDS:-86400}

      # Everything host-specific derives from PUBLIC_HOST (infra/.env); the
      # explicit variables remain as overrides.
      FRONTEND_URL: ${FRONTEND_URL:-https://${PUBLIC_HOST}}
      APP_URL: ${APP_URL:-https://${PUBLIC_HOST}}
      PAGE_SIZE: ${PAGE_SIZE}
      CALL_RING_TIMEOUT_MS: ${CALL_RING_TIMEOUT_MS}
      NOTIFICATION_READ_RETENTION_DAYS: ${NOTIFICATION_READ_RETENTION_DAYS:-90}
      NOTIFICATION_UNREAD_RETENTION_DAYS: ${NOTIFICATION_UNREAD_RETENTION_DAYS:-180}
      PLAYGROUND_ENABLED: ${PLAYGROUND_ENABLED:-true}
      PLAYGROUND_CALL_DURATION_SECONDS: ${PLAYGROUND_CALL_DURATION_SECONDS:-60}
      PLAYGROUND_IDLE_TIMEOUT_SECONDS: ${PLAYGROUND_IDLE_TIMEOUT_SECONDS:-30}
      PLAYGROUND_MAX_PARTICIPANTS: ${PLAYGROUND_MAX_PARTICIPANTS:-2}
      PLAYGROUND_MAX_ACTIVE_CALLS_PER_IP: ${PLAYGROUND_MAX_ACTIVE_CALLS_PER_IP:-1}
      PLAYGROUND_MAX_ACTIVE_CALLS_PER_IDENTITY: ${PLAYGROUND_MAX_ACTIVE_CALLS_PER_IDENTITY:-1}
      PLAYGROUND_CALL_RATE_LIMIT_MAX: ${PLAYGROUND_CALL_RATE_LIMIT_MAX:-5}
      PLAYGROUND_CALL_RATE_LIMIT_WINDOW_SECONDS: ${PLAYGROUND_CALL_RATE_LIMIT_WINDOW_SECONDS:-600}
      PLAYGROUND_DAILY_CALL_LIMIT: ${PLAYGROUND_DAILY_CALL_LIMIT:-20}
      PLAYGROUND_MAX_ACTIVE_CALLS_GLOBAL: ${PLAYGROUND_MAX_ACTIVE_CALLS_GLOBAL:-5}
      PLAYGROUND_PARTICIPANT_TOKEN_TTL_SECONDS: ${PLAYGROUND_PARTICIPANT_TOKEN_TTL_SECONDS:-180}
      PLAYGROUND_TURN_CREDENTIAL_TTL_SECONDS: ${PLAYGROUND_TURN_CREDENTIAL_TTL_SECONDS:-60}
      PLAYGROUND_TURN_CALLS_PER_MINUTE: ${PLAYGROUND_TURN_CALLS_PER_MINUTE:-3}
      SOCKET_AUTH_ATTEMPTS_PER_MINUTE: ${SOCKET_AUTH_ATTEMPTS_PER_MINUTE:-20}
      SOCKET_MAX_UNAUTHENTICATED_CONNECTIONS: ${SOCKET_MAX_UNAUTHENTICATED_CONNECTIONS:-100}
      PLAYGROUND_SOCKET_EVENTS_PER_MINUTE: ${PLAYGROUND_SOCKET_EVENTS_PER_MINUTE:-120}

      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}

      # OCI Monitoring
      OCI_COMPARTMENT_OCID: ${OCI_COMPARTMENT_OCID}
      OCI_INSTANCE_OCID: ${OCI_INSTANCE_OCID}
      OCI_REGION: ${OCI_REGION}

    networks:
      - purplecallio

    expose:
      - "3005"

    # Observability only: Compose does not restart unhealthy containers.
    # start_period covers `prisma migrate deploy` on boot.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3005/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  # ── Next.js Web App ─────────────────────────────────────────────────────────
  web:

    restart: unless-stopped

    depends_on:
      - server

    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      # Baked into the browser bundle at build time. Only PUBLIC identifiers:
      # the Google OAuth client ID and the Razorpay key_id are designed to be
      # sent to browsers, so they default to the server-side values. Never
      # map a *_SECRET here.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://${PUBLIC_HOST}/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://${PUBLIC_HOST}}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID}}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-${RAZORPAY_KEY_ID}}

    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://${PUBLIC_HOST}/api}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://${PUBLIC_HOST}}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID}}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-${RAZORPAY_KEY_ID}}

    networks:
      - purplecallio

    expose:
      - "5173"

    # Observability only. The image has no curl/wget; Node 20 has fetch.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/robots.txt').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ── coturn TURN Server ──────────────────────────────────────────────────────
  coturn:
    # Coturn is not health-checked: it runs with host networking and has no
    # HTTP endpoint; verify it with turnutils_uclient (see infra/DEPLOYMENT.md).
    # Pin the upstream release tag; validate this image against the deployed
    # configuration before rollout because the live daemon was unavailable
    # during this repository audit.
    image: ${COTURN_IMAGE:-coturn/coturn:4.18.0-r0}
    restart: unless-stopped

    network_mode: host

    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

    command: >
      -c /etc/coturn/turnserver.conf
      --static-auth-secret=${TURN_SECRET}
      --external-ip=${TURN_EXTERNAL_IP:-${TURN_SERVER}}
      --total-quota=${TURN_TOTAL_QUOTA:-64}
      --max-bps=${TURN_MAX_BPS:-4000000}
      --bps-capacity=${TURN_BPS_CAPACITY:-8000000}
      --stale-nonce=600
      --cert=${TURN_TLS_CERT_FILE:-/etc/letsencrypt/live/${TURN_HOST:-${PUBLIC_HOST}}/fullchain.pem}
      --pkey=${TURN_TLS_KEY_FILE:-/etc/letsencrypt/live/${TURN_HOST:-${PUBLIC_HOST}}/privkey.pem}

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    # Not health-checked: port 80 only redirects to the public HTTPS host,
    # which a probe inside the container cannot reach reliably.
    image: nginx:alpine
    restart: unless-stopped

    depends_on:
      - server
      - web

    ports:
      - "80:80"
      - "443:443"

    # nginx/templates/*.template are rendered into conf.d at start with
    # PUBLIC_HOST filled in. conf.d is an empty tmpfs so the image's stock
    # default.conf is not served.
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in infra/.env (see .env.example)}
      NGINX_ENVSUBST_FILTER: PUBLIC_HOST
    tmpfs:
      - /etc/nginx/conf.d
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./ssl:/etc/nginx/ssl:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx_cache:/var/cache/nginx

    networks:
      - purplecallio

volumes:
  postgres_data:
  nginx_cache:

networks:
  purplecallio:
    driver: bridge
